# Plan d'hébergement d'INNOV CRM sur Render (0.9.5, HT-05, HT-06 ; docs/exploitation.md).
# Région Francfort, offres payantes : base persistante avec sauvegardes quotidiennes et
# restauration à un instant donné (PITR). Aucun secret ici : `sync: false` les fait saisir dans
# le tableau de bord ; `generateValue` les fait tirer au hasard par Render.
# À appliquer avec un « Blueprint » Render, puis à relire service par service (offres, région).
databases:
  - name: innov-base
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: '16'
    databaseName: innov
    user: innov
    ipAllowList: [] # joignable seulement depuis les services Render

services:
  - type: web
    name: innov-api
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: standard
    region: frankfurt
    numInstances: 1
    healthCheckPath: /api/health/
    preDeployCommand: python manage.py migrate --noinput
    envVars: &communs
      - key: ENVIRONNEMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: innov-base, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: innov-file, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: INNOV_CLE_CHIFFREMENT
        sync: false # clé de chiffrement des secrets de double authentification : à conserver
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # ex. api.innov.exemple
      - key: CORS_ALLOWED_ORIGINS
        sync: false # ex. https://portail.innov.exemple
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PORTAIL_URL
        sync: false
      - key: INNOV_STOCKAGE
        value: r2
      - key: R2_URL
        sync: false # https://<compte>.r2.cloudflarestorage.com
      - key: R2_COMPARTIMENT
        value: innov-production-pieces
      - key: R2_CLE
        sync: false
      - key: R2_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PUSH_ACTIF
        value: 'true'
      - key: PUSH_EXPO_JETON
        sync: false

  - type: worker
    name: innov-worker
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A config worker --loglevel info --concurrency 2
    plan: standard
    region: frankfurt
    envVars: *communs

  - type: worker
    name: innov-beat
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A config beat --loglevel info
    plan: starter
    region: frankfurt
    envVars: *communs

  - type: keyvalue
    name: innov-file
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction # une file de tâches ne perd rien

  # Sauvegarde logique hors de Render, chiffrée, chaque nuit (en plus du PITR de Render).
  - type: cron
    name: innov-sauvegarde
    runtime: docker
    dockerContext: .
    dockerfilePath: deploiement/sauvegarde/Dockerfile
    schedule: '17 1 * * *' # 01 h 17 UTC
    plan: starter
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: innov-base, property: connectionString }
      - key: R2_URL
        sync: false
      - key: R2_CLE
        sync: false
      - key: R2_SECRET
        sync: false
      - key: R2_COMPARTIMENT_SAUVEGARDES
        value: innov-production-sauvegardes
      - key: SAUVEGARDE_PHRASE
        sync: false # phrase de chiffrement des sauvegardes : à conserver hors de Render


# Le portail est publié par Cloudflare Pages (architecture §21) : en-têtes dans
# portail/public/_headers, guide d'exploitation §2.
