        date:
          type: string
          format: date
        classement:
          $ref: '#/components/schemas/ClassementEnum'
        ecarts:
          type: array
          items:
            $ref: '#/components/schemas/EcartConformite'
        fige:
          type: boolean
          readOnly: true
        terminee:
          type: boolean
          readOnly: true
