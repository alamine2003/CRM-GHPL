      properties:
        objectif_prevu:
          type: string
        resultat:
          type: string
          nullable: true
        resultat_obtenu:
          type: string
        presentations:
          type: array
          items:
            $ref: '#/components/schemas/Presentation'
        remises:
          type: array
          items:
            $ref: '#/components/schemas/Remise'
        resume:
          type: string
        prochaine_action_type:
