      - prochaine_action
      - prochaine_action_echeance
      - prochaine_action_type
      - remises
      - resultat
      - resultat_obtenu
      - resume
      - visite_proposee
    ControlePlanning:
      type: object
      description: 'Contrôle du planning (PLN-004) : `bloquant` (RG-015) ou `signalement`
        (RG-016).'
      properties:
        code:
