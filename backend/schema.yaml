      required:
      - code
    CreationPoste:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
        type_poste:
          $ref: '#/components/schemas/TypePosteEnum'
        reseaux:
          type: array
          items:
            type: string
            format: uuid
        secteurs:
          type: array
          items:
            type: string
            format: uuid
      required:
      - libelle
      - type_poste
    CreationProduit:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 160
        code:
          type: string
          maxLength: 40
        classe:
          type: string
          format: uuid
          nullable: true
        reseaux:
          type: array
          items:
            type: string
            format: uuid
      required:
      - libelle
    CreationReseau:
