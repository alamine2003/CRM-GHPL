        plateforme:
          $ref: '#/components/schemas/PlateformeEnum'
        systeme:
          type: string
          maxLength: 60
        modele:
          type: string
          maxLength: 80
        version_app:
          type: string
          maxLength: 20
      required:
      - identifiant_installation
      - plateforme
    Division:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pays:
          type: string
          readOnly: true
        code:
          type: string
          maxLength: 20
        libelle:
          type: string
          maxLength: 120
        archive:
          type: boolean
          readOnly: true
      required:
      - archive
      - code
      - id
      - libelle
      - pays
    ErreurClient:
      type: object
      properties:
        client:
          $ref: '#/components/schemas/ClientEnum'
        version:
          type: string
          maxLength: 20
        message:
          type: string
          maxLength: 500
        pile:
          type: string
          maxLength: 4000
        ecran:
          type: string
          maxLength: 200
