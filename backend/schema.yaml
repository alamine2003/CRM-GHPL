    get:
      operationId: transferts_liste
      description: 'Transferts d''un compte vers un autre pays (ORG-010) : le siège
        les autorise.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - utilisateurs
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transfert'
          description: ''
    post:
      operationId: transfert_autoriser
      description: 'Transferts d''un compte vers un autre pays (ORG-010) : le siège
        les autorise.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - utilisateurs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransfertCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransfertCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransfertCreation'
        required: true
      security:
      - jetonAcces: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfert'
          description: ''
components:
  schemas:
    Activite:
      type: object
      description: Événement d'audit de l'utilisateur lui-même (connexions, sécurité
        du compte).
      properties:
        le:
          type: string
          format: date-time
        action:
          type: string
        resultat:
          type: string
        client:
          type: string
          nullable: true
        adresse:
          type: string
          nullable: true
      required:
      - action
      - adresse
      - client
      - le
      - resultat
    Affectation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pays:
          type: string
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        active:
          type: boolean
          readOnly: true
        accorde_par:
          type: string
        retire_par:
          type: string
      required:
      - active
      - debut
      - id
      - motif
      - pays
    AffectationCreation:
      type: object
      properties:
        pays:
          type: string
          maxLength: 2
        role:
          $ref: '#/components/schemas/RoleEnum'
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
      required:
      - motif
      - pays
      - role
    Appareil:
      type: object
      description: 'Téléphone enregistré (USR-006 CA1 : appareil, système, version,
        dernier contact).'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        identifiant:
          type: string
        prenom:
          type: string
        nom:
          type: string
        plateforme:
          $ref: '#/components/schemas/PlateformeEnum'
        plateforme_libelle:
          type: string
        systeme:
          type: string
          title: Version du système
          maxLength: 60
        modele:
          type: string
          maxLength: 80
        version_app:
          type: string
          title: Version de l'application
          maxLength: 20
        cree_le:
          type: string
          format: date-time
          readOnly: true
        dernier_contact:
          type: string
          format: date-time
        revoque:
          type: boolean
        revoque_le:
          type: string
          format: date-time
          nullable: true
      required:
      - cree_le
      - id
      - identifiant
      - nom
      - plateforme
      - plateforme_libelle
      - prenom
      - revoque
    AttributionRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    Changement:
      type: object
      properties:
        actuel:
          type: string
          maxLength: 256
        nouveau:
          type: string
          maxLength: 256
      required:
      - actuel
      - nouveau
    ClientEnum:
      enum:
      - portail
      - mobile
      type: string
      description: |-
        * `portail` - Portail web
        * `mobile` - Application mobile
    Code:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
      required:
      - code
    CodesSecours:
      type: object
      properties:
        codes_secours:
          type: array
          items:
            type: string
      required:
      - codes_secours
    Connexion:
      type: object
      properties:
        identifiant:
          type: string
          maxLength: 150
        mot_de_passe:
          type: string
          maxLength: 256
        client:
          $ref: '#/components/schemas/ClientEnum'
        appareil:
          allOf:
          - $ref: '#/components/schemas/DescriptionAppareil'
