        ajoutees:
          type: array
          items:
            $ref: '#/components/schemas/VisiteFigee'
        retirees:
          type: array
          items:
            $ref: '#/components/schemas/VisiteFigee'
        deplacees:
          type: array
          items:
            $ref: '#/components/schemas/Deplacement'
        modifiees:
          type: array
          items:
            $ref: '#/components/schemas/Modification'
      required:
      - ajoutees
      - deplacees
      - modifiees
      - retirees
    ConformiteJournee:
      type: object
