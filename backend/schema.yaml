        id:
          type: string
          format: uuid
          readOnly: true
        civilite:
          oneOf:
          - $ref: '#/components/schemas/CiviliteEnum'
          - $ref: '#/components/schemas/BlankEnum'
        prenom:
          type: string
          maxLength: 80
        nom:
          type: string
          maxLength: 80
        type_libelle:
          type: string
        specialite_libelle:
          type: string
          nullable: true
        numero_ordre:
          type: string
          maxLength: 40
        telephone_mobile:
          type: string
          maxLength: 20
        telephone_pro:
          type: string
          maxLength: 20
        courriel:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        potentiel:
          $ref: '#/components/schemas/PotentielEnum'
        secteur:
          type: string
          nullable: true
        localite:
          type: string
          nullable: true
        statut:
          $ref: '#/components/schemas/StatutFicheEnum'
        cree_par:
          $ref: '#/components/schemas/PersonneResume'
        cree_le:
          type: string
          format: date-time
          readOnly: true
        lieux:
          type: array
          items:
            type: string
          readOnly: true
        cibles:
          type: integer
          readOnly: true
      required:
      - cibles
      - cree_le
      - cree_par
      - id
      - lieux
      - nom
      - potentiel
      - type_libelle
    ComparaisonVersions:
      type: object
      description: 'PLN-014 CA1 : ce qui a changé depuis la version précédente.'
