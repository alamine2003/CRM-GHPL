          type: string
          maxLength: 150
        prenom:
          type: string
          maxLength: 150
        nom:
          type: string
          maxLength: 150
        courriel:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        langue:
          $ref: '#/components/schemas/LangueEnum'
      required:
      - identifiant
