openapi: 3.0.3
info:
  title: INNOV CRM
  version: 0.1.1
  description: API du CRM multi-pays des délégués médicaux.
paths:
  /api/v1/affectations/{id}/terminer/:
    post:
      operationId: affectation_terminer
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - affectations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinAffectation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FinAffectation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FinAffectation'
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Affectation'
          description: ''
  /api/v1/appareils/:
    get:
      operationId: appareils_liste
      description: Téléphones des comptes du pays actif (USR-006 CA1).
      tags:
      - appareils
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appareil'
          description: ''
  /api/v1/appareils/{id}/revoquer/:
