components:
  schemas:
    Activite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        periode:
          $ref: '#/components/schemas/PeriodeActiviteEnum'
        type:
          $ref: '#/components/schemas/TypeActiviteEnum'
        commentaire:
          type: string
          maxLength: 500
        demande_superviseur:
          type: boolean
        avec_visites:
          type: boolean
          readOnly: true
      required:
      - avec_visites
      - date
      - id
      - type
    ActiviteCompte:
      type: object
      description: Événement d'audit de l'utilisateur lui-même (connexions, sécurité
        du compte).
      properties:
        le:
          type: string
          format: date-time
        action:
          type: string
        resultat:
          type: string
        client:
          type: string
          nullable: true
        adresse:
          type: string
          nullable: true
      required:
      - action
      - adresse
      - client
      - le
      - resultat
    ActiviteEnum:
      enum:
      - hospitalier
      - prive
      type: string
      description: |-
        * `hospitalier` - Hospitalier
        * `prive` - Privé
    ActiviteFigee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        periode:
          $ref: '#/components/schemas/PeriodeActiviteEnum'
        type:
          $ref: '#/components/schemas/TypeActiviteEnum'
        commentaire:
          type: string
        demande_superviseur:
          type: boolean
      required:
      - commentaire
      - date
      - demande_superviseur
      - id
      - periode
      - type
    Affectation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pays:
          type: string
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        active:
          type: boolean
          readOnly: true
        accorde_par:
          type: string
        retire_par:
          type: string
      required:
      - active
      - debut
      - id
      - motif
      - pays
    AffectationCreation:
      type: object
      properties:
        pays:
          type: string
          maxLength: 2
        role:
          $ref: '#/components/schemas/RoleEnum'
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
      required:
      - motif
      - pays
      - role
    AjoutCibles:
      type: object
      properties:
        prospects:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
          minItems: 1
        frequence:
          type: integer
          maximum: 20
          minimum: 1
          nullable: true
      required:
      - prospects
    Anomalie:
      type: object
      properties:
        entite:
          type: string
        identifiant:
          type: string
        niveau:
          type: string
        motif:
          type: string
      required:
      - entite
      - identifiant
      - motif
      - niveau
    Appareil:
      type: object
      description: 'Téléphone enregistré (USR-006 CA1 : appareil, système, version,
        dernier contact).'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        identifiant:
          type: string
        prenom:
          type: string
        nom:
          type: string
        plateforme:
          $ref: '#/components/schemas/PlateformeEnum'
        plateforme_libelle:
          type: string
        systeme:
          type: string
