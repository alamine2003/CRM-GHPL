          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PieceJointe'
          description: ''
  /api/v1/visites/{id}/rapport/pieces/{piece}/:
    get:
      operationId: piece_jointe_lire
      description: |-
        RPT-007 CA2 : la pièce jointe ne se lit que par qui voit le rapport ; elle se retire
        tant que le rapport n'est pas soumis.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: piece
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - visites
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
    delete:
      operationId: piece_jointe_retirer
      description: |-
        RPT-007 CA2 : la pièce jointe ne se lit que par qui voit le rapport ; elle se retire
        tant que le rapport n'est pas soumis.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: piece
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - visites
      security:
      - jetonAcces: []
      responses:
        '204':
          description: No response body
  /api/v1/visites/{id}/rapport/soumettre/:
    post:
      operationId: rapport_soumettre
      description: |-
        RPT-002 CA1 : la soumission exige le socle et les champs obligatoires du pays. RPT-010 :
        version figée, retard après 23 h 59 le jour de la visite, heure du téléphone contrôlée.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - visites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoumissionRapport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SoumissionRapport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SoumissionRapport'
        required: true
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rapport'
          description: ''
  /api/v1/visites/{id}/reporter/:
    post:
      operationId: visite_reporter
      description: |-
        VIS-007 : reporter une visite prévue ; un motif est obligatoire, la nouvelle visite est
        liée à l'originale (CA1) et passe par le superviseur dans une semaine approuvée (CA2).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - visites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Report'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Report'
        required: true
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visite'
          description: ''
  /api/v1/visites/{id}/retirer/:
    post:
      operationId: visite_retirer
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - visites
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visite'
          description: ''
  /api/v1/visites/{id}/terminer/:
    post:
      operationId: visite_terminer
      description: 'VIS-004 : le délégué termine une visite en cours ; rejouable depuis
        la file.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - visites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Terminaison'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Terminaison'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Terminaison'
        required: true
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visite'
          description: ''
  /api/v1/visites/imprevue/:
    post:
      operationId: visite_imprevue
      description: 'VIS-008 : déclarer une visite hors planning, justifiée (CA1),
        qui démarre aussitôt.'
      tags:
      - visites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Imprevue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Imprevue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Imprevue'
        required: true
      security:
      - jetonAcces: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visite'
          description: ''
components:
  schemas:
    ATraiter:
      type: object
      description: |-
        « À traiter aujourd'hui » (DC-47, engagement 3) : les journées par délégué, et le
        nombre de plannings qui attendent une décision.
      properties:
        delegues:
          type: array
          items:
            $ref: '#/components/schemas/DelegueATraiter'
        plannings_a_valider:
          type: integer
      required:
      - delegues
      - plannings_a_valider
    ActionPrecedente:
      type: object
      description: 'RPT-006 CA1 : la prochaine action notée à la dernière visite chez
        ce prospect.'
      properties:
        date:
          type: string
          format: date
        type:
          type: string
        texte:
          type: string
        echeance:
          type: string
          format: date
          nullable: true
        visite_proposee:
          type: boolean
      required:
      - date
      - echeance
      - texte
      - type
      - visite_proposee
    Activite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        periode:
          $ref: '#/components/schemas/PeriodeActiviteEnum'
        type:
          $ref: '#/components/schemas/TypeActiviteEnum'
        commentaire:
          type: string
          maxLength: 500
        demande_superviseur:
          type: boolean
        avec_visites:
          type: boolean
          readOnly: true
      required:
      - avec_visites
      - date
      - id
      - type
    ActiviteCompte:
      type: object
      description: Événement d'audit de l'utilisateur lui-même (connexions, sécurité
        du compte).
      properties:
        le:
          type: string
          format: date-time
        action:
          type: string
        resultat:
          type: string
        client:
          type: string
          nullable: true
        adresse:
          type: string
          nullable: true
      required:
      - action
      - adresse
      - client
      - le
      - resultat
    ActiviteEnum:
      enum:
      - hospitalier
      - prive
      type: string
      description: |-
        * `hospitalier` - Hospitalier
        * `prive` - Privé
    ActiviteFigee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        periode:
          $ref: '#/components/schemas/PeriodeActiviteEnum'
        type:
          $ref: '#/components/schemas/TypeActiviteEnum'
        commentaire:
          type: string
        demande_superviseur:
          type: boolean
      required:
      - commentaire
      - date
      - demande_superviseur
      - id
      - periode
      - type
    Affectation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pays:
          type: string
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        active:
          type: boolean
          readOnly: true
        accorde_par:
          type: string
        retire_par:
          type: string
      required:
      - active
      - debut
      - id
      - motif
      - pays
    AffectationCreation:
      type: object
      properties:
        pays:
          type: string
          maxLength: 2
        role:
          $ref: '#/components/schemas/RoleEnum'
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
      required:
      - motif
      - pays
      - role
    AjoutCibles:
      type: object
      properties:
        prospects:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
          minItems: 1
        frequence:
          type: integer
          maximum: 20
          minimum: 1
          nullable: true
      required:
      - prospects
    Anomalie:
      type: object
      properties:
        entite:
          type: string
        identifiant:
          type: string
        niveau:
          type: string
        motif:
          type: string
      required:
      - entite
      - identifiant
      - motif
      - niveau
    Appareil:
      type: object
      description: 'Téléphone enregistré (USR-006 CA1 : appareil, système, version,
        dernier contact).'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        identifiant:
          type: string
        prenom:
          type: string
        nom:
          type: string
        plateforme:
          $ref: '#/components/schemas/PlateformeEnum'
        plateforme_libelle:
          type: string
        systeme:
          type: string
          title: Version du système
          maxLength: 60
        modele:
          type: string
          maxLength: 80
        version_app:
          type: string
          title: Version de l'application
          maxLength: 20
        cree_le:
          type: string
          format: date-time
          readOnly: true
        dernier_contact:
          type: string
          format: date-time
        revoque:
          type: boolean
        revoque_le:
          type: string
          format: date-time
          nullable: true
      required:
      - cree_le
      - id
      - identifiant
      - nom
      - plateforme
      - plateforme_libelle
      - prenom
      - revoque
    ArchivageProspect:
      type: object
      properties:
        motif:
          type: string
          maxLength: 200
    AttributionRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    BlankEnum:
      enum:
      - ''
    CandidatsRemplacement:
      type: object
      description: Qui l'utilisateur peut faire remplacer, et par qui (superviseurs
        du pays).
      properties:
        superviseurs:
          type: array
          items:
            $ref: '#/components/schemas/Personne'
        remplacants:
          type: array
          items:
            $ref: '#/components/schemas/Personne'
      required:
      - remplacants
      - superviseurs
    ChampLu:
      type: object
      description: Un champ du pays (RPT-008) tel que rempli, avec son libellé du
        jour du rapport.
      properties:
        code:
          type: string
        libelle:
          type: string
        type:
          type: string
        valeur:
          nullable: true
      required:
      - code
      - libelle
      - type
      - valeur
    ChampRapport:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        libelle:
          type: string
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeChampEnum'
          readOnly: true
        options:
          readOnly: true
        obligatoire:
          type: boolean
          readOnly: true
        ordre:
          type: integer
          readOnly: true
      required:
      - code
      - id
      - libelle
      - obligatoire
      - options
      - ordre
      - type
    ChampsEnum:
      enum:
      - prospect
      - etablissement
      - objectif
      - note
      type: string
      description: |-
        * `prospect` - prospect
        * `etablissement` - etablissement
        * `objectif` - objectif
        * `note` - note
    Changement:
      type: object
      properties:
        actuel:
          type: string
          maxLength: 256
        nouveau:
          type: string
          maxLength: 256
      required:
      - actuel
      - nouveau
    ChangementFiche:
      type: object
      properties:
        id:
          type: string
          format: uuid
        champ:
          type: string
        ancienne:
          type: string
        nouvelle:
          type: string
        auteur:
          allOf:
          - $ref: '#/components/schemas/PersonneResume'
          nullable: true
        origine:
          type: string
        le:
          type: string
          format: date-time
      required:
      - ancienne
      - auteur
      - champ
      - id
      - le
      - nouvelle
      - origine
    Cible:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        poste:
          type: string
          format: uuid
        prospect:
          $ref: '#/components/schemas/ProspectCible'
        frequence:
          type: integer
          maximum: 32767
          minimum: 0
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        en_cours:
          type: boolean
          readOnly: true
        hors_secteur:
          type: boolean
          readOnly: true
      required:
      - debut
      - en_cours
      - frequence
      - hors_secteur
      - id
      - poste
      - prospect
    CiviliteEnum:
      enum:
      - dr
      - pr
      - m
      - mme
      type: string
      description: |-
        * `dr` - Dr
        * `pr` - Pr
        * `m` - M.
        * `mme` - Mme
    ClassementEnum:
      enum:
      - conforme
      - a_verifier
      type: string
      description: |-
        * `conforme` - Conforme
        * `a_verifier` - À vérifier
    ClientEnum:
      enum:
      - portail
      - mobile
      type: string
      description: |-
        * `portail` - Portail web
        * `mobile` - Application mobile
    Code:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
      required:
      - code
    CodeControleEnum:
      enum:
      - incomplete
      - fiche_inactive
      - sans_exercice
      - meme_heure
      - meme_prospect
      - jour_non_planifiable
      - seuil_bas
      - seuil_haut
      - hors_cible
      - hors_secteur
      - a_non_planifie
      - echeance_depassee
      - soumis_en_retard
      type: string
      description: |-
        * `incomplete` - incomplete
        * `fiche_inactive` - fiche_inactive
        * `sans_exercice` - sans_exercice
        * `meme_heure` - meme_heure
        * `meme_prospect` - meme_prospect
        * `jour_non_planifiable` - jour_non_planifiable
        * `seuil_bas` - seuil_bas
        * `seuil_haut` - seuil_haut
        * `hors_cible` - hors_cible
        * `hors_secteur` - hors_secteur
        * `a_non_planifie` - a_non_planifie
        * `echeance_depassee` - echeance_depassee
        * `soumis_en_retard` - soumis_en_retard
    CodesSecours:
      type: object
      properties:
        codes_secours:
          type: array
          items:
            type: string
      required:
      - codes_secours
    Comparaison:
      type: object
      description: Fiche complète pour la comparaison côte à côte (PRP-009 CA1).
