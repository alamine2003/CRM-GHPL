        fermee:
          type: boolean
        demande_envoyee:
          type: boolean
        delegue:
          $ref: '#/components/schemas/Delegue'
        remplace:
          allOf:
          - $ref: '#/components/schemas/Delegue'
          nullable: true
        escalade:
          allOf:
          - $ref: '#/components/schemas/Escalade'
          nullable: true
        postes:
          type: array
          items:
            type: string
