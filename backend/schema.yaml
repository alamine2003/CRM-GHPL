          type: string
          maxLength: 160
        code:
          type: string
          maxLength: 40
        classe:
          type: string
          format: uuid
          nullable: true
        reseaux:
          type: array
          items:
            type: string
            format: uuid
      required:
      - libelle
    CreationReseau:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 20
        division:
          type: string
          format: uuid
      required:
      - code
      - division
      - libelle
    CreationSecteur:
      type: object
      properties:
        libelle:
