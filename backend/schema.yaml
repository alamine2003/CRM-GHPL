      - conformite
      - controles
      - courante
      - delegue
      - demande_envoyee
      - escalade
      - fermee
      - fuseau
      - jours
      - kilometrage
      - modifiable
      - passages
      - peut_creer
      - planning
      - postes
      - precedente
      - remplace
      - reprenables
      - reseaux
      - semaine
      - suivante
      - visites
