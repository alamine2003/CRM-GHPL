components:
  schemas:
    Activite:
      type: object
      description: Événement d'audit de l'utilisateur lui-même (connexions, sécurité
        du compte).
      properties:
        le:
          type: string
          format: date-time
        action:
          type: string
        resultat:
          type: string
        client:
          type: string
          nullable: true
        adresse:
          type: string
          nullable: true
      required:
      - action
      - adresse
      - client
      - le
      - resultat
    ActiviteEnum:
      enum:
      - hospitalier
      - prive
      type: string
      description: |-
        * `hospitalier` - Hospitalier
        * `prive` - Privé
    Affectation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pays:
          type: string
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        active:
          type: boolean
          readOnly: true
        accorde_par:
          type: string
        retire_par:
          type: string
      required:
      - active
      - debut
      - id
      - motif
      - pays
    AffectationCreation:
      type: object
      properties:
        pays:
          type: string
          maxLength: 2
        role:
          $ref: '#/components/schemas/RoleEnum'
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
      required:
      - motif
      - pays
      - role
    AjoutCibles:
      type: object
      properties:
        prospects:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
          minItems: 1
        frequence:
          type: integer
          maximum: 20
          minimum: 1
          nullable: true
      required:
      - prospects
    Anomalie:
      type: object
      properties:
        entite:
          type: string
        identifiant:
          type: string
        niveau:
          type: string
        motif:
          type: string
      required:
      - entite
      - identifiant
      - motif
      - niveau
    Appareil:
      type: object
      description: 'Téléphone enregistré (USR-006 CA1 : appareil, système, version,
        dernier contact).'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        identifiant:
          type: string
        prenom:
          type: string
        nom:
          type: string
        plateforme:
          $ref: '#/components/schemas/PlateformeEnum'
        plateforme_libelle:
          type: string
        systeme:
          type: string
          title: Version du système
          maxLength: 60
        modele:
          type: string
          maxLength: 80
        version_app:
          type: string
          title: Version de l'application
          maxLength: 20
        cree_le:
          type: string
          format: date-time
          readOnly: true
        dernier_contact:
          type: string
          format: date-time
        revoque:
          type: boolean
        revoque_le:
          type: string
          format: date-time
          nullable: true
      required:
      - cree_le
      - id
      - identifiant
      - nom
      - plateforme
      - plateforme_libelle
      - prenom
      - revoque
    ArchivageProspect:
      type: object
      properties:
        motif:
          type: string
          maxLength: 200
    AttributionRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    BlankEnum:
      enum:
      - ''
    Changement:
      type: object
      properties:
        actuel:
          type: string
          maxLength: 256
        nouveau:
          type: string
          maxLength: 256
      required:
      - actuel
      - nouveau
    ChangementFiche:
      type: object
      properties:
        id:
          type: string
          format: uuid
        champ:
          type: string
        ancienne:
          type: string
        nouvelle:
          type: string
        auteur:
          allOf:
          - $ref: '#/components/schemas/PersonneResume'
          nullable: true
        origine:
          type: string
        le:
          type: string
          format: date-time
      required:
      - ancienne
      - auteur
      - champ
      - id
      - le
      - nouvelle
      - origine
    Cible:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        poste:
          type: string
          format: uuid
        prospect:
          $ref: '#/components/schemas/ProspectCible'
        frequence:
          type: integer
          maximum: 32767
          minimum: 0
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        en_cours:
          type: boolean
          readOnly: true
        hors_secteur:
          type: boolean
          readOnly: true
      required:
      - debut
      - en_cours
      - frequence
      - hors_secteur
      - id
      - poste
      - prospect
    CiviliteEnum:
      enum:
      - dr
      - pr
      - m
      - mme
      type: string
      description: |-
        * `dr` - Dr
        * `pr` - Pr
        * `m` - M.
        * `mme` - Mme
    ClientEnum:
      enum:
      - portail
      - mobile
      type: string
      description: |-
        * `portail` - Portail web
        * `mobile` - Application mobile
    Code:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
      required:
      - code
    CodesSecours:
      type: object
      properties:
        codes_secours:
          type: array
          items:
            type: string
      required:
      - codes_secours
    Comparaison:
      type: object
      description: Fiche complète pour la comparaison côte à côte (PRP-009 CA1).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        civilite:
          oneOf:
          - $ref: '#/components/schemas/CiviliteEnum'
          - $ref: '#/components/schemas/BlankEnum'
        prenom:
          type: string
          maxLength: 80
        nom:
          type: string
          maxLength: 80
        type_libelle:
          type: string
        specialite_libelle:
          type: string
          nullable: true
        numero_ordre:
          type: string
          maxLength: 40
        telephone_mobile:
          type: string
          maxLength: 20
        telephone_pro:
          type: string
          maxLength: 20
        courriel:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        potentiel:
          $ref: '#/components/schemas/PotentielEnum'
        secteur:
          type: string
          nullable: true
        localite:
          type: string
          nullable: true
        statut:
          $ref: '#/components/schemas/StatutFicheEnum'
        cree_par:
          $ref: '#/components/schemas/PersonneResume'
        cree_le:
          type: string
          format: date-time
          readOnly: true
        lieux:
          type: array
          items:
            type: string
          readOnly: true
        cibles:
          type: integer
          readOnly: true
      required:
      - cibles
      - cree_le
      - cree_par
      - id
      - lieux
      - nom
      - potentiel
      - type_libelle
    Connexion:
      type: object
      properties:
        identifiant:
          type: string
          maxLength: 150
        mot_de_passe:
          type: string
          maxLength: 256
        client:
          $ref: '#/components/schemas/ClientEnum'
        appareil:
          allOf:
          - $ref: '#/components/schemas/DescriptionAppareil'
          description: Obligatoire pour l'application mobile (USR-006).
      required:
      - client
      - identifiant
      - mot_de_passe
    ConnexionCode:
      type: object
      properties:
        jeton_etape:
          type: string
          maxLength: 2000
        code:
          type: string
          description: Code de l'application ou de secours.
          maxLength: 20
      required:
      - code
      - jeton_etape
    CreationDivision:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 20
      required:
      - code
      - libelle
    CreationLocalite:
      type: object
      properties:
        secteur:
          type: string
          format: uuid
        libelle:
          type: string
          maxLength: 120
      required:
      - libelle
      - secteur
    CreationPays:
      type: object
      properties:
        code:
          type: string
