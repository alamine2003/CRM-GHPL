          description: ''
  /api/v1/auth/connexion/:
    post:
      operationId: connexion
      description: |-
        Ouvre une session ; si la double authentification est active, répond 202 et
        attend le code sur connexion/code/ (SEC-003).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connexion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Connexion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Connexion'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jetons'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtapeDoubleAuth'
          description: ''
  /api/v1/auth/connexion/code/:
    post:
