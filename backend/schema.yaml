openapi: 3.0.3
info:
  title: INNOV CRM
  version: 0.1.9
  description: API du CRM multi-pays des délégués médicaux.
paths:
  /api/v1/affectations/{id}/terminer/:
    post:
      operationId: affectation_terminer
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - affectations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinAffectation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FinAffectation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FinAffectation'
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Affectation'
          description: ''
  /api/v1/appareils/:
    get:
      operationId: appareils_liste
      description: Téléphones des comptes du pays actif (USR-006 CA1).
      tags:
      - appareils
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appareil'
          description: ''
  /api/v1/appareils/{id}/revoquer/:
    post:
      operationId: appareil_revoquer
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - appareils
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appareil'
          description: ''
  /api/v1/auth/activite/:
    get:
      operationId: mon_activite
      description: 'Les 20 derniers événements de sécurité du compte : repérer une
        connexion inconnue.'
      tags:
      - auth
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activite'
          description: ''
  /api/v1/auth/connexion/:
    post:
      operationId: connexion
      description: |-
        Ouvre une session ; si la double authentification est active, répond 202 et
        attend le code sur connexion/code/ (SEC-003).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connexion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Connexion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Connexion'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jetons'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtapeDoubleAuth'
          description: ''
  /api/v1/auth/connexion/code/:
    post:
      operationId: connexion_code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConnexionCode'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jetons'
          description: ''
  /api/v1/auth/deconnexion/:
    post:
      operationId: deconnexion
      tags:
      - auth
      security:
      - jetonAcces: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/double-auth/:
    get:
      operationId: double_auth_etat
      tags:
      - auth
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtatDoubleAuth'
          description: ''
  /api/v1/auth/double-auth/activer/:
    post:
      operationId: double_auth_activer
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Code'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Code'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Code'
        required: true
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodesSecours'
          description: ''
  /api/v1/auth/double-auth/codes-secours/:
    post:
      operationId: double_auth_codes_secours
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Code'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Code'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Code'
        required: true
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodesSecours'
          description: ''
  /api/v1/auth/double-auth/desactiver/:
    post:
      operationId: double_auth_desactiver
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Code'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Code'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Code'
        required: true
      security:
      - jetonAcces: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/double-auth/initialiser/:
    post:
      operationId: double_auth_initialiser
      tags:
      - auth
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialisationDoubleAuth'
          description: ''
  /api/v1/auth/moi/:
    get:
      operationId: moi
      tags:
      - auth
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moi'
          description: ''
    patch:
      operationId: moi_langue
      description: Change la langue de l'interface de l'utilisateur (USR-004).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChangementLangue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChangementLangue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChangementLangue'
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moi'
          description: ''
  /api/v1/auth/mot-de-passe/changement/:
    post:
      operationId: mot_de_passe_changement
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Changement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Changement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Changement'
        required: true
      security:
      - jetonAcces: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/mot-de-passe/oubli/:
    post:
      operationId: mot_de_passe_oubli
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Oubli'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Oubli'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Oubli'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/mot-de-passe/reinitialisation/:
    post:
      operationId: mot_de_passe_reinitialisation
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reinitialisation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reinitialisation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reinitialisation'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/perimetre/:
    get:
      operationId: perimetre
      description: |-
        Périmètre de l'utilisateur pour le pays actif : rôles, actions permises, pays
        accessibles. Les clients s'en servent pour masquer ; le serveur reste seul juge.
      tags:
      - auth
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perimetre'
          description: ''
  /api/v1/auth/rafraichir/:
    post:
      operationId: rafraichir
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rafraichissement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Rafraichissement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Rafraichissement'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jetons'
          description: ''
  /api/v1/auth/sessions/:
    get:
      operationId: sessions_liste
      tags:
      - auth
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/sessions/{id}/revoquer/:
    post:
      operationId: session_revoquer
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jetonAcces: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/sessions/autres/revoquer/:
    post:
      operationId: sessions_revoquer_autres
      tags:
      - auth
      security:
      - jetonAcces: []
      responses:
        '204':
          description: No response body
  /api/v1/ciblage/cibles/{id}/:
    patch:
      operationId: cible_frequence
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ciblage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFrequence'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFrequence'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFrequence'
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cible'
          description: ''
  /api/v1/ciblage/cibles/{id}/retirer/:
    post:
      operationId: cible_retirer
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ciblage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetraitCible'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RetraitCible'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RetraitCible'
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cible'
          description: ''
  /api/v1/ciblage/moi/:
    get:
      operationId: ciblage_moi
      description: |-
        Listes des postes que l'utilisateur occupe : celle du délégué, à emporter sur le
        téléphone (CA2).
      tags:
      - ciblage
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListeCible'
          description: ''
  /api/v1/ciblage/postes/:
    get:
      operationId: ciblage_postes
      tags:
      - ciblage
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PosteCible'
          description: ''
  /api/v1/ciblage/postes/{id}/:
    get:
      operationId: ciblage_liste
      parameters:
      - in: query
        name: historique
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ciblage
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeCible'
          description: ''
    post:
      operationId: ciblage_ajouter
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ciblage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjoutCibles'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AjoutCibles'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AjoutCibles'
        required: true
      security:
      - jetonAcces: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultatAjout'
          description: ''
  /api/v1/ciblage/postes/{id}/candidats/:
    get:
      operationId: ciblage_candidats
      description: |-
        Prospects actifs des secteurs du poste, pas encore ciblés (affectation
        territoriale) ; potentiel A d'abord.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: potentiel
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
      tags:
      - ciblage
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProspectCible'
          description: ''
  /api/v1/doublons/:
    get:
      operationId: doublons_liste
      description: 'PRP-009 : file des doublons probables du pays actif.'
      parameters:
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - en_attente
          - fusionnes
          - refuse
          - separes
      tags:
      - doublons
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doublon'
          description: ''
  /api/v1/doublons/{id}/trancher/:
    post:
      operationId: doublon_trancher
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - doublons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionDoublon'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionDoublon'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionDoublon'
        required: true
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doublon'
          description: ''
  /api/v1/erreurs-clients/:
    post:
      operationId: erreur_client
      description: |-
        Le portail et l'application signalent leurs plantages (architecture §19).

        Ouvert sans session (une erreur peut survenir avant la connexion), limité en débit ;
        le rapport ne contient ni donnée saisie ni identité.
      tags:
      - erreurs-clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErreurClient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ErreurClient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ErreurClient'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/etablissements/:
    get:
      operationId: etablissements_liste
      parameters:
      - in: query
        name: activite
        schema:
          type: string
          enum:
          - hospitalier
          - prive
      - in: query
        name: localite
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: portee
        schema:
          type: string
          enum:
          - pays
          - perimetre
      - in: query
        name: q
        schema:
          type: string
        description: Nom, localité, téléphone
      - in: query
        name: sans_coordonnees
        schema:
          type: string
        description: '1'
      - in: query
        name: secteur
        schema:
          type: string
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - a_valider
          - actif
          - archive
          - fusionne
      - in: query
        name: taille
        schema:
          type: integer
      - in: query
        name: tri
        schema:
          type: string
          enum:
          - nom
          - recents
          - secteur
          - type
      - in: query
        name: type
        schema:
          type: string
      tags:
      - etablissements
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeEtablissements'
          description: ''
    post:
      operationId: etablissement_creer
      tags:
      - etablissements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaisieEtablissement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaisieEtablissement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaisieEtablissement'
      security:
      - jetonAcces: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etablissement'
          description: ''
  /api/v1/etablissements/{id}/:
    get:
      operationId: etablissement_detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etablissements
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etablissement'
          description: ''
    patch:
      operationId: etablissement_modifier
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etablissements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSaisieEtablissement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSaisieEtablissement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSaisieEtablissement'
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etablissement'
          description: ''
  /api/v1/etablissements/{id}/archiver/:
    post:
      operationId: etablissement_archiver
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etablissements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchivageProspect'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArchivageProspect'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArchivageProspect'
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etablissement'
          description: ''
  /api/v1/etablissements/{id}/exercices/:
    get:
      operationId: etablissement_exercices
      description: |-
        Lieux d'exercice des fiches visibles. Les gère qui peut modifier la fiche prospect :
        l'administrateur pays, ou le délégué sur sa fiche encore à valider (RG-041). Sur une
        fiche commune, le délégué proposera un nouvel exercice (PRP-014, 0.1.8).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etablissements
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exercice'
          description: ''
  /api/v1/etablissements/{id}/historique/:
    get:
      operationId: etablissement_historique
      description: 'PRP-012 CA1 : changements champ par champ d''une fiche visible.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etablissements
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangementFiche'
          description: ''
  /api/v1/etablissements/{id}/valider/:
    post:
      operationId: etablissement_valider
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - etablissements
      security:
      - jetonAcces: []
      responses:
        '200':
          content:
