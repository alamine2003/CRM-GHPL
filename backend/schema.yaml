components:
  schemas:
    Affectation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pays:
          type: string
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        active:
          type: boolean
          readOnly: true
        accorde_par:
          type: string
        retire_par:
          type: string
      required:
      - active
      - debut
      - id
      - motif
      - pays
    AffectationCreation:
      type: object
      properties:
        pays:
          type: string
          maxLength: 2
        role:
          $ref: '#/components/schemas/RoleEnum'
        motif:
          type: string
          maxLength: 300
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
      required:
      - motif
      - pays
      - role
    AttributionRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
    Changement:
      type: object
      properties:
        actuel:
          type: string
          maxLength: 256
        nouveau:
          type: string
          maxLength: 256
      required:
      - actuel
      - nouveau
    ClientEnum:
      enum:
      - portail
      - mobile
      type: string
      description: |-
        * `portail` - Portail web
        * `mobile` - Application mobile
    Connexion:
      type: object
      properties:
        identifiant:
          type: string
          maxLength: 150
        mot_de_passe:
          type: string
          maxLength: 256
        client:
          $ref: '#/components/schemas/ClientEnum'
      required:
      - client
      - identifiant
      - mot_de_passe
    CreationDivision:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 20
      required:
      - code
      - libelle
    CreationPays:
      type: object
      properties:
        code:
          type: string
          description: Code ISO d'une filiale du catalogue.
          maxLength: 2
      required:
      - code
    CreationPoste:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
        type_poste:
          $ref: '#/components/schemas/TypePosteEnum'
        reseaux:
          type: array
          items:
            type: string
            format: uuid
        secteurs:
          type: array
          items:
            type: string
            format: uuid
      required:
      - libelle
      - type_poste
    CreationReseau:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
        code:
          type: string
          maxLength: 20
        division:
          type: string
          format: uuid
      required:
      - code
      - division
      - libelle
    CreationSecteur:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
        zone:
          type: string
          format: uuid
      required:
      - libelle
      - zone
    CreationUtilisateur:
      type: object
      properties:
        identifiant:
          type: string
          maxLength: 150
        prenom:
          type: string
          maxLength: 150
        nom:
          type: string
          maxLength: 150
        courriel:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        langue:
          $ref: '#/components/schemas/LangueEnum'
      required:
      - identifiant
      - nom
      - prenom
    Division:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pays:
          type: string
          readOnly: true
        code:
          type: string
          maxLength: 20
        libelle:
          type: string
          maxLength: 120
        archive:
          type: boolean
          readOnly: true
      required:
      - archive
      - code
      - id
      - libelle
      - pays
    Fin:
      type: object
      properties:
        fin:
          type: string
          format: date
    FinAffectation:
      type: object
      properties:
        fin:
          type: string
          format: date
    Informations:
      type: object
      properties:
        produit:
          type: string
        version:
          type: string
        environnement:
          type: string
        langue:
          type: string
          description: Langue retenue pour la réponse.
        message:
          type: string
        langues:
          type: array
          items:
            $ref: '#/components/schemas/Langue'
      required:
      - environnement
      - langue
      - langues
      - message
      - produit
      - version
    Jetons:
      type: object
      properties:
        acces:
          type: string
          description: Jeton d'accès, à envoyer en « Bearer ».
        expire_dans:
          type: integer
          description: Durée de validité du jeton d'accès (s).
        rafraichissement:
          type: string
          nullable: true
          description: Application mobile uniquement ; nul pour le portail (cookie
            HttpOnly).
        utilisateur:
          $ref: '#/components/schemas/Moi'
      required:
      - acces
      - expire_dans
      - rafraichissement
      - utilisateur
    Langue:
      type: object
      properties:
        code:
          type: string
        libelle:
          type: string
      required:
      - code
      - libelle
    LangueEnum:
      enum:
      - fr
      - en
      type: string
      description: |-
        * `fr` - Français
        * `en` - Anglais
    Libelle:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
      required:
      - libelle
    ModificationParametre:
      type: object
      properties:
        valeur: {}
      required:
      - valeur
    Moi:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        identifiant:
          type: string
        prenom:
          type: string
        nom:
          type: string
        courriel:
          type: string
        langue:
          $ref: '#/components/schemas/LangueEnum'
        pays_principal:
          allOf:
          - $ref: '#/components/schemas/PaysResume'
          nullable: true
        est_siege:
          type: boolean
      required:
      - courriel
      - est_siege
      - id
      - identifiant
      - nom
      - pays_principal
      - prenom
    MonOrganisation:
      type: object
      properties:
        postes:
          type: array
          items:
            $ref: '#/components/schemas/MonPoste'
        postes_supervises:
          type: integer
        reseaux:
          type: array
          items:
            $ref: '#/components/schemas/PerimetreReseau'
        superviseur_manquant:
          type: boolean
      required:
      - postes
      - postes_supervises
      - reseaux
      - superviseur_manquant
    MonPoste:
      type: object
      properties:
        occupation:
          $ref: '#/components/schemas/Occupation'
        type_poste:
          type: string
        type_libelle:
          type: string
        reseaux:
          type: array
          items:
            $ref: '#/components/schemas/Resume'
        secteurs:
          type: array
          items:
            $ref: '#/components/schemas/Resume'
        superviseur:
          allOf:
          - $ref: '#/components/schemas/Personne'
          nullable: true
      required:
      - occupation
      - reseaux
      - secteurs
      - superviseur
      - type_libelle
      - type_poste
    Occupation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        poste:
          $ref: '#/components/schemas/Resume'
        personne:
          $ref: '#/components/schemas/Personne'
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        principal:
          type: boolean
        actif:
          type: boolean
          readOnly: true
      required:
      - actif
      - debut
      - id
      - personne
      - poste
    OccupationCreation:
      type: object
      properties:
        utilisateur:
          type: string
          format: uuid
        debut:
          type: string
          format: date
      required:
      - utilisateur
    Oubli:
      type: object
      properties:
        identifiant:
          type: string
          description: Identifiant ou courriel.
          maxLength: 254
      required:
      - identifiant
    Parametre:
      type: object
      properties:
        cle:
          type: string
        description:
          type: string
        valeur: {}
        defaut: {}
        personnalise:
          type: boolean
          description: Vrai si le pays a changé la valeur.
        hypothese:
          type: boolean
          description: Valeur par défaut encore à confirmer.
      required:
      - cle
      - defaut
      - description
      - hypothese
      - personnalise
      - valeur
    PatchedLibelle:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
    PatchedModificationPoste:
      type: object
      properties:
        libelle:
          type: string
          maxLength: 120
        type_poste:
          $ref: '#/components/schemas/TypePosteEnum'
        reseaux:
          type: array
          items:
            type: string
            format: uuid
        secteurs:
          type: array
          items:
            type: string
            format: uuid
    Pays:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        nom:
          type: string
          readOnly: true
        fuseau:
          type: string
          readOnly: true
        langue:
          allOf:
          - $ref: '#/components/schemas/LangueEnum'
          readOnly: true
        devise:
          type: string
          readOnly: true
        statut:
          allOf:
          - $ref: '#/components/schemas/StatutEnum'
          readOnly: true
        cree_le:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - cree_le
      - devise
      - fuseau
      - langue
      - nom
      - statut
    PaysResume:
      type: object
      properties:
        code:
          type: string
        nom:
          type: string
        fuseau:
          type: string
      required:
      - code
      - fuseau
      - nom
    Perimetre:
      type: object
      properties:
        pays_actif:
          allOf:
          - $ref: '#/components/schemas/PaysResume'
          nullable: true
        vue_consolidee:
          type: boolean
        roles:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        pays_accessibles:
          type: array
          items:
            $ref: '#/components/schemas/PaysResume'
      required:
      - actions
      - pays_accessibles
      - pays_actif
      - roles
      - vue_consolidee
    PerimetreReseau:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reseau:
          $ref: '#/components/schemas/Resume'
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        actif:
          type: boolean
          readOnly: true
      required:
      - actif
      - debut
      - id
      - reseau
    PerimetreReseauCreation:
      type: object
      properties:
        reseau:
          type: string
          format: uuid
        debut:
          type: string
          format: date
      required:
      - reseau
    Personne:
      type: object
      properties:
        id:
          type: string
          format: uuid
        identifiant:
          type: string
        prenom:
          type: string
        nom:
          type: string
      required:
      - id
      - identifiant
      - nom
      - prenom
    Poste:
      type: object
      description: Un poste avec son occupant et son superviseur du jour ; « vacant
        » sans occupant.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pays:
          type: string
          readOnly: true
        libelle:
          type: string
          maxLength: 120
        type_poste:
          $ref: '#/components/schemas/TypePosteEnum'
        type_libelle:
          type: string
        reseaux:
          type: array
          items:
            $ref: '#/components/schemas/Resume'
        secteurs:
          type: array
          items:
            $ref: '#/components/schemas/Secteur'
        occupant:
          allOf:
          - $ref: '#/components/schemas/Personne'
          nullable: true
          readOnly: true
        superviseur:
          allOf:
          - $ref: '#/components/schemas/Personne'
          nullable: true
          readOnly: true
        vacant:
          type: boolean
          readOnly: true
        archive:
          type: boolean
          readOnly: true
      required:
      - archive
      - id
      - libelle
      - occupant
      - pays
      - reseaux
      - secteurs
      - superviseur
      - type_libelle
      - type_poste
      - vacant
    Rafraichissement:
      type: object
      properties:
        rafraichissement:
          type: string
          description: Application mobile uniquement ; le portail utilise le cookie.
    Rattachement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        superviseur:
          $ref: '#/components/schemas/Personne'
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
          nullable: true
        actif:
          type: boolean
          readOnly: true
      required:
      - actif
      - debut
      - id
      - superviseur
    RattachementCreation:
      type: object
      properties:
        superviseur:
          type: string
          format: uuid
        debut:
          type: string
          format: date
      required:
      - superviseur
    Reinitialisation:
      type: object
      properties:
        jeton:
