          - $ref: '#/components/schemas/Planning'
          nullable: true
        peut_creer:
          type: boolean
        modifiable:
          type: boolean
        visites:
          type: array
          items:
            $ref: '#/components/schemas/Visite'
        passages:
          type: array
          items:
            $ref: '#/components/schemas/Passage'
        activites:
          type: array
          items:
            $ref: '#/components/schemas/Activite'
        reprenables:
          type: integer
        kilometrage:
          allOf:
          - $ref: '#/components/schemas/Kilometrage'
          nullable: true
        controles:
          allOf:
          - $ref: '#/components/schemas/Controles'
          nullable: true
        reseaux:
